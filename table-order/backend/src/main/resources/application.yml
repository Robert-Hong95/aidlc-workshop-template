spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/table_order?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
    username: ${SPRING_DATASOURCE_USERNAME:tableorder}
    password: ${SPRING_DATASOURCE_PASSWORD:tableorder123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-for-jwt-token-generation-min-256-bits}
  expiration: ${JWT_EXPIRATION:57600000}

file:
  upload-dir: ${FILE_UPLOAD_DIR:./uploads}

server:
  port: 8080
