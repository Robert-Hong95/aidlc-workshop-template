spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

jwt:
  secret: test-secret-key-for-jwt-token-generation-min-256-bits-long
  access-expiration: 3600000
  refresh-expiration: 57600000
  qr-expiration: 600000

file:
  upload-dir: ./test-uploads
